  checked: 2026-10-30
  en:
    question: I put 1000 in a savings account at 10% interest per year, compounded yearly. How much do I have after 2 years?
    answer: You have 1210. After the first year you have 1100, and the second year's interest is paid on 1100, so you end with 1210.
    short: "1210."
