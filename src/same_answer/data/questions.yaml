    wrong_answer: Hayır, yıldırım aynı yere asla iki kez düşmez.
    accept:
      - '\b(düşer|düşebilir\w*)\b(?!\s*mi)'
    wrong:
      - '(asla|hiçbir zaman)[^.]{0,20}\b(düşmez|düşemez)\b'
      - '\b(düşmez|düşemez)\b'

- id: lightning-before-thunder
  category: everyday_science
  source: https://www.weather.gov/safety/lightning-science-thunder
  confirms: You see lightning immediately, while the sound of thunder takes about 5 seconds to travel a mile.
  checked: 2026-10-30
  en:
    question: Why do I see lightning before I hear the thunder?
    answer: Because light travels much faster than sound. You see the flash almost at once, while the sound takes about 5 seconds to travel a mile.
    short: Light travels faster than sound.
    extra: Counting the seconds and dividing by 5 gives the distance in miles.
    wrong_answer: Because thunder starts some time after the flash, when the air has cooled down.
    accept:
      - 'light\b[^.]{0,20}\bfaster\b'
      - 'sound\b[^.]{0,20}\bslower\b'
    wrong:
      - 'thunder\b[^.]{0,20}\b(starts?|begins?|happens?|comes?)\b[^.]{0,15}\b(later|after)'
  tr:
    question: Şimşeği neden gök gürültüsünden önce görürüm?
    answer: Çünkü ışık sesten çok daha hızlı yol alır. Şimşeği neredeyse anında görürsünüz, ses ise 1,6 kilometreyi yaklaşık 5 saniyede geçer.
    short: Işık sesten daha hızlı yol alır.
    extra: Aradaki saniyeleri sayarak şimşeğin ne kadar uzakta olduğunu tahmin edebilirsiniz.
    wrong_answer: Çünkü gök gürültüsü şimşekten bir süre sonra, hava soğuyunca başlar.
    accept:
      - 'ışık\w*[^.]{0,20}hızlı'
      - 'ses\w*[^.]{0,20}yavaş'
    wrong:
      - 'gök gürültüsü[^.]{0,30}sonra[^.]{0,20}başla\w*'

- id: moonlight-reflected
  category: everyday_science
  source: https://spaceplace.nasa.gov/moon-phases/en/
  confirms: Moonlight is sunlight reflecting off the Moon's surface, and without the Sun the Moon would be completely dark.
  checked: 2026-10-30
  en:
    question: Does the Moon make its own light?
    direct: "no"
    answer: No. Moonlight is sunlight reflecting off the Moon's surface.
    short: No, it reflects sunlight.
    extra: Without the Sun, the Moon would be completely dark.
    wrong_answer: Yes, the Moon glows with its own light.
