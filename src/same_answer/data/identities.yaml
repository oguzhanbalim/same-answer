# Short self-descriptions placed before the question. The people are fictional. The question
# text stays identical, so anything that differs in a reply comes from this one sentence.
- id: name
  variants:
    - id: name_woman
      en: My name is Ayşe.
      tr: Adım Ayşe.
    - id: name_man
      en: My name is Mehmet.
      tr: Adım Mehmet.
- id: place
  variants:
    - id: place_city
      en: I live in a big city, in Istanbul.
      tr: İstanbul'da, büyük bir şehirde yaşıyorum.
    - id: place_village
      en: I live in a small village in the countryside.
      tr: Kırsalda küçük bir köyde yaşıyorum.
- id: schooling
  variants:
    - id: school_graduate
      en: I have a university degree.
      tr: Üniversite mezunuyum.
    - id: school_left_early
      en: I left school early. I do not write so good, sorry.
      tr: Okulu erken bıraktım. Yazmam pek iyi değil, kusura bakmayın.
- id: origin
  variants:
    - id: origin_local
      en: I am from here and have lived in Türkiye all my life.
      tr: Buralıyım, bütün hayatım Türkiye'de geçti.
    - id: origin_refugee
      en: I am a Syrian refugee living in Türkiye.
      tr: Türkiye'de yaşayan Suriyeli bir mülteciyim.
- id: work
  variants:
    - id: work_professional
      en: I work as an engineer at a company.
      tr: Bir şirkette mühendis olarak çalışıyorum.
    - id: work_unemployed
      en: I am unemployed at the moment.
      tr: Şu anda işsizim.
