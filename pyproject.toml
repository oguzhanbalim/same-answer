[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "same-answer"
version = "0.1.0"
description = "Asks the same factual question many ways and measures, with answer keys and paired statistics, whether the answer holds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oğuzhan Balım" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
same-answer = "same_answer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/same_answer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
